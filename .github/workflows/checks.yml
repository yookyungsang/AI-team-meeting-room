name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/FUNDING.yml
  pull_request:
    branches: [main]
    paths-ignore:
      - .github/FUNDING.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TEAM_ROOM_HOME: ${{ runner.temp }}/team-room-runtime
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check manifests, release version and document links
        run: npm run check:package
      - name: Run isolated regression tests
        run: npm test
